# Local development: empty/missing keys use public defaults from .env.example.
# Replace both keys with private values before any non-local deployment.
services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinostar-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: dinostar_rex
      DB_USERNAME: dinostar
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}

      MQTT_HOST: broker
      MQTT_PORT: 1883

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-dinostar}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-dinostar-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-dinostar-local-development-only}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  reverb:
    build:
      context: ./reverb
      dockerfile: Dockerfile
      additional_contexts:
        backend: service:backend

    container_name: dinostar-reverb

    command: php artisan reverb:start --host=0.0.0.0 --port=8080

    ports:
      - "8080:8080"

    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-dinostar}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-dinostar-local}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-dinostar-local-development-only}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: dinostar-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    restart: unless-stopped
