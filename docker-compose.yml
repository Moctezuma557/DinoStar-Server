services:

  broker:
    image: eclipse-mosquitto:2
    container_name: dinostar-broker
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  database:
    image: postgres:15
    container_name: dinostar-db
    environment:
      POSTGRES_DB: dinostar_rex
      POSTGRES_USER: dinostar
      POSTGRES_PASSWORD: dinostar2026
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinostar-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped


volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
