services:

  # ===== BROKER MQTT =====
  broker:
    image: eclipse-mosquitto:2
    container_name: dinostar-broker
    ports:
      - "1883:1883"   #  <== MQTT
      - "9001:9001"   # <== WebSocket MQTT (por si se necesita)
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  # ===== BASE DE DATOS =====
  database:
    image: postgres:15
    container_name: dinostar-db
    environment:
      POSTGRES_DB: dinostar_rex
      POSTGRES_USER: dinostar
      POSTGRES_PASSWORD: dinostar2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  # ===== BACKEND LARAVEL =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dinostar-backend
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: dinostar_rex
      DB_USERNAME: dinostar
      DB_PASSWORD: dinostar2026
      MQTT_HOST: broker
      MQTT_PORT: 1883
    depends_on:
      - database
      - broker
    volumes:
      - ./backend:/var/www/html
    restart: unless-stopped

  # ===== FRONTEND REACT =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dinostar-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

# ===== VOLÚMENES PERSISTENTES =====
volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log: